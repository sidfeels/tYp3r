[project]
name = "backend"
version = "0.1.0"
description = "tYp3r v2 Backend - LLM Prompt Obfuscation API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "art>=6.5",
    "fastapi>=0.121.3",
    "tiktoken>=0.12.0",
    "uvicorn>=0.38.0",
    "pydantic>=2.0.0",
    "pyfiglet>=1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[tool.setuptools]
packages = ["api", "core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not trio'"
markers = [
    "trio: marks tests as trio tests (deselected by default)"
]
